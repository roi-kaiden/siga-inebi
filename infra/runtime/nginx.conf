pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Signed download tokens travel in query strings: log paths without args.
    log_format siga '$request_method $uri $status $request_time';
    access_log /dev/stdout siga;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Preserve the HTTPS scheme supplied by Cloud Run; local smoke can supply it.
    map $http_x_forwarded_proto $original_scheme {
        default $http_x_forwarded_proto;
        "" $scheme;
    }
    server {
        listen ${PORT};
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 20m;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location ~ ^/(api|admin|static)(/|$) {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $original_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
